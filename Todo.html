<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <title>Todo List</title>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Todo App</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">contact</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            Todo items
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                            <li><a class="dropdown-item" href="#">Action</a></li>
                            <li><a class="dropdown-item" href="#">Another action</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="#">Something else here</a></li>
                        </ul>
                    </li>
                </ul>
                <form class="d-flex">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>
    <h2 class="text-center my-4">TODO LIST</h2>
    <div class="container">
        
            <div class="">
                <label for="title" class="form-label">TITLE</label>
                <input type="text" class="form-control" id="title" aria-describedby="emailHelp">
                <div id="emailHelp" class="form-text">Add your item.</div>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea class="form-control" id="description" rows="3"></textarea>
            </div>
            <button  class="btn btn-primary my-2" id="add">Add Item</button>
            <button  class="btn btn-primary my-2 " id="clear" onclick="clearstr()">Clear Items</button>
        
        <div id="item">
            <h2>Your Items</h2>
            <table class="table" >
                <thead>
                    <tr>
                        <th scope="col">S.no</th>
                        <th scope="col">Item</th>
                        <th scope="col">Description</th>
                        <th scope="col">Action</th>
                    </tr>
                </thead>
                <tbody id="tabelbody">
                    <tr>
                        <th scope="row"></th>
                        <td></td>
                        <td></td>
                        <td><button class="btn btn-primary btn-sm">Delete</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
        <script>
            function getupdate(){
                console.log("updateing list...");
                tit=document.getElementById("title").value;
                desc=document.getElementById("description").value;
                if (localStorage.getItem('itemsJson')==null){
                    itemJsonArray=[];
                    itemJsonArray.push([tit,desc]);
                    localStorage.setItem('itemsJson',JSON.stringify(itemJsonArray))
                }

                else{
                    itemJsonArrayStr=localStorage.getItem('itemsJson')
                    itemJsonArray=JSON.parse(itemJsonArrayStr);
                    itemJsonArray.push([tit,desc]);
                    localStorage.setItem('itemsJson',JSON.stringify(itemJsonArray))
                  update();  
                }
            }

                function update(){
                     if (localStorage.getItem('itemsJson')==null){
                    itemJsonArray=[];
                    localStorage.setItem('itemsJson',JSON.stringify(itemJsonArray))
                }

                else{
                    itemJsonArrayStr=localStorage.getItem('itemsJson')
                    itemJsonArray=JSON.parse(itemJsonArrayStr);
                }

                
                let tabelbody=document.getElementById("tabelbody");
                let str="";
                itemJsonArray.forEach((element,index) => {
                    str+=`
                    <tr>
                    <th scope="row">${index+1}</th>
                    <td>${element[0]}</td>
                    <td>${element[1]}</td>
                    <td><button class="btn btn-danger btn-sm"onclick="deleted(${index})">Delete</button></td>
                    </tr>`
                    });
                    
                    tabelbody.innerHTML=str;

            };
            add=document.getElementById("add");
            add.addEventListener("click",getupdate);

            function deleted(itemIndex){
                console.log("deleteing",itemIndex);
                itemJsonArrayStr=localStorage.getItem('itemsJson')
                itemJsonArray=JSON.parse(itemJsonArrayStr);
                itemJsonArray.splice(itemIndex,1);
                localStorage.setItem('itemsJson',JSON.stringify(itemJsonArray))
                update();
            }
            
            function clearstr(){
                if(confirm("do you really want to clear?"))
                localStorage.clear();
                update();
            }

        </script>
</body>

</html>
